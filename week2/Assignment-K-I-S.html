<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS boxes and Layout Practicest</title>
    <style>
        html {
            background-color: rebeccapurple;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .red-box{
            width: 100px;
            height: 100px;
            background-color: red;
        }

        .blue-box{
            width: 300px;
            height: 400px;
            background-color: blue;
            border: 2px solid red;
        }

        .green-box{
            width: 250px;
            height: 600px;
            background-color: green;
            border-radius: 6px;
        }

        h1{
            width:400px;
            color: white;
            text-align: center;
        }

        h2{
            width: 800px;
            color:orange;
            text-align: right;
        }
    </style>

</head>
<body>
<div class="red-box"></div>
<div class="blue-box"></div>
<div class="green-box"></div>


<h1>This is a cool h1 tag</h1>
<h2>This is a really cool h2 tag</h2>

</body>

</html>
