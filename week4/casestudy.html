<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study: Constructing a web page framework(Holy Grail Layout)</title>

    <style>
        header {

            width: 90%;

            height: 100px;

            background-color: orange;

            border: 3px solid green;

            padding: 10px;

            margin: 25px;

        }

        .name {
            text-align: center;
            color: #F9ECE5;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size:xx-large;
        }



        nav {

            position: fixed;

            width: 90%;

            height: 50px;

            background-color: rebeccapurple;

            top: 170px;

            left: 35px;

        }



        article {

            width: 65%;

            height: 200px;

            background-color: purple;

            border: 5px solid grey;

            position: relative;

            top: 15px;

        }



        aside {

            width: 40%;

            height: 420px;

            background-color: goldenrod;

            position: absolute;

            left: 50%;

            right: 10%;

            top: 235px;

        }



        footer {

            width: 100%;

            height: 50px;

            background-color: navy;

            position: fixed;

            bottom: 0px;

        }



        .articles {

            position: relative;

            left: 30px;

            top: 45px;

            width: 65%;

            height: 70%;

        }
    </style>


</head>

<body>
    <header><p class="name">Holy Grail Layout</p></header>

    <nav></nav>

    <div>

        <div class="articles">

            <article></article>

            <article></article>

        </div>

        <aside></aside>

    </div>

    <footer></footer>
</body>

</html>
