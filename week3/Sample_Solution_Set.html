<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolutey, that's positioned! PRACTICE ASSIGNMENT!!!!</title>

    <style>
        .box {
            position: absolute;
            top: 100px;
            left: 100px;
            background-color: green;
            width: 500px;
            height: 500px;
        }
    </style>

</head>

<body>
    <div class="box">
        <div class="box" style="border: 2px dotted orange; width:300px; height:300px; background-color:white;">
            <div class="box" style="top:100px; left:100px; background-color: orange;border: 2px dashed white; width:100px; height:100px;">
            </div>
        </div>
    </div>

</body>

</html>
