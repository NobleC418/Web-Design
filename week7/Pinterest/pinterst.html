<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest</title>
    <link rel="stylesheet" href="css/pinstyles.css">
    <style>
        .anime_pin {
            width: 375px;
            background-image: url(../Pinterest/anime.jpg);
        }

        .cooking_pin{
            width: 750px;
            height: 600px;
            background-image: url(../Pinterest/cooking.jpg);
        }

        .mma_pin{
            height: 460px;
            width: 300px;
            border: 4px solid rebeccapurple;
            background-image: url(../Pinterest/mma.jpg);
        }

        .beat_making_pin{
            background-image: url(../Pinterest/beat_making.jpg);
            border: 3px solid orangered;
            width: 500px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="pin" style="top:20px; left:40px;"></div>
        <div class="pin anime_pin" style="top:200px; left: 350px;"></div>
        <div class="pin cooking_pin" style="top:20px; left:750px;"></div>
        <div class="pin mma_pin" style="top:540px; left:200px;"></div>
        <div class="pin beat_making_pin" style="top:740px; left:600px;"></div>
    </div>
</body>

</html>
